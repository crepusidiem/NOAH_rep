# NOAH Pilot Configuration & Frozen Settings (N-02)
# Milestone: Small-scale 5-modality pilot on 1,000 candidate patients

experiment:
  name: "noah_pilot_5mod_1000pts"
  stage: "pilot"
  seed: 42
  active_modalities:
    - categorical
    - numeric
    - cxr
    - text
    - ecg
  disabled_modalities:
    - echo  # Scope agreement: ECHO deferred to full-scale reproduction

cohort:
  manifest_path: "data/pilot_cohort_manifest.csv"
  total_candidates: 1000
  splits:
    train: 700
    val: 150
    test: 150
  min_events_per_patient: 64 # EXPLICIT (p. 15)
  max_window_length: 1024    # DEVIATION (reduced from 2048 for pilot memory efficiency)
  overlap_length: 256        # EXPLICIT (p. 15)
  prefix_length: 6           # DERIVED (6 demographic attributes: birth_year, race, gender, insurance, language, marital_status)

data_paths:
  mimic_root: "/home/wey371/rajpurkarlab/datasets"
  hosp_dir: "mimic-iv/physionet.org/files/mimiciv/2.2/hosp"
  icu_dir: "mimic-iv/physionet.org/files/mimiciv/2.2/icu"
  ed_dir: "mimic-iv-ed/physionet.org/files/mimic-iv-ed/2.2/ed"
  note_dir: "mimic-iv-note/physionet.org/files/mimic-iv-note/2.2/note"
  ecg_dir: "mimic-iv-ecg/1.0"
  cxr_dir: "cxr/MIMIC-CXR/raw_jpg"
  cache_dir: "data/pilot_cache"

feature_dimensions:
  # Modality content representation dimensions
  content_dims:
    categorical: null # Learned category embedding mapped to d_model
    numeric: 44       # DERIVED conditional on A-10: 22 dyadic scales x 2 (sin, cos)
    cxr: 768          # EXPLICIT (Table 15): RAD-DINO CLS
    text: 768         # EXPLICIT (Table 15): BioLORD
    ecg: 192          # EXPLICIT (Table 15): OTIS final patch mean
    echo: null        # Disabled
  category_vocab_size: 31 # EXPLICIT (Supplementary Table 1)

encoders:
  text:
    model_id: "FremyCompany/BioLORD-2023" # A-09 ASSUMED candidate
    max_length: 128
    pooling: "mean"
    l2_normalize: true
  cxr:
    model_id: "microsoft/rad-dino"       # A-09 ASSUMED candidate
    input_size: 518
    crop_size: 518
    output_feature: "cls"
  ecg:
    model_id: "otis"                     # A-09 ASSUMED candidate
    patch_size: [1, 24]                  # EXPLICIT (p. 15): 1x24 patches
    n_patches: 2496                      # EXPLICIT (p. 15): 208 patches/lead x 12 leads
    output_pooling: "patch_mean"         # EXPLICIT (p. 15): mean of final patches

model:
  profile: "pilot_tiny"                  # DEVIATION: reduced scale for pilot
  d_model: 256                           # Reduced from 768 for fast pilot turnaround
  n_layers: 4                            # Reduced from 12
  n_heads: 4                             # Reduced from 12
  d_head: 64                             # EXPLICIT/DERIVED: d_model / n_heads = 64
  d_latent: 128                          # Reduced from 384
  ffn_expansion: 4                       # Reduced from 8 (d_ffn = 1024)
  dropout: 0.1                           # EXPLICIT (p. 50)
  drop_path: 0.1                         # EXPLICIT (p. 50)
  attention_dropout: 0.1                 # EXPLICIT (p. 50)

temporal:
  base_frequency: 10000.0                # EXPLICIT (p. 18)
  temporal_layers: [0, 1, 2, 3]          # A-16 ASSUMED interpretation of Table 16 (layers 0-3)
  gap_time_unit: "hours"                 # A-12 ASSUMED candidate
  age_time_unit: "years"                 # A-12 ASSUMED candidate
  gap_transform: "log1p"                 # EXPLICIT: log(1 + delta)

variational:
  latent_dim: 128                        # Pilot latent dimension
  prior_sigma_min: 0.05                  # EXPLICIT (p. 19): smooth squash min
  prior_sigma_max: 2.0                   # EXPLICIT (p. 19): smooth squash max
  prior_temperature: 1.0                 # Standard sampling temperature

decoder:
  cascade_order:                         # EXPLICIT (p. 20)
    - "category"
    - "specifics"
    - "modality_value"
    - "delta_gate"
  time_gate_threshold: 0.5               # A-25 ASSUMED
  specifics_gate_threshold: 0.5          # A-25 ASSUMED

training:
  class_weighted_heads: true
  batch_size: 4                          # Pilot batch size
  gradient_accumulation_steps: 2
  learning_rate: 6.0e-4                  # EXPLICIT (p. 50)
  lr_warmup_epochs: 6                    # EXPLICIT (p. 50)
  kl_warmup_epochs: 10                   # EXPLICIT (p. 50)
  weight_decay: 0.01                     # EXPLICIT (p. 50)
  gradient_clip_norm: 10.0               # EXPLICIT (p. 50)
  optimizer:
    matrix_optimizer: "muon"             # EXPLICIT (p. 50): Muon for hidden 2D weights
    vector_optimizer: "adamw"            # EXPLICIT (p. 50): AdamW for embeddings and heads
  loss_weights:
    rec_posterior: 0.3                   # EXPLICIT (p. 20)
    rec_prior: 0.1                       # EXPLICIT (p. 20)
    kl_max: 1.0                          # EXPLICIT (p. 20)
